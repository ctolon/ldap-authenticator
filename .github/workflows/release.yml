# Tag-driven releases. The tag is the release; this workflow verifies that
# the tag is one that should have been created, and then publishes it.
name: Release

on:
  push:
    tags:
      - 'v*'
      - 'contrib/*/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release
        required: true

# Read-only at the top. Only the publish job is given write, and only to
# contents: a release workflow with more access than it needs is a release
# workflow that can do more than release.
permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # One release at a time, and never cancel one halfway: a half-published
  # tag is worse than a slow queue.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.parse.outputs.version }}
      module: ${{ steps.parse.outputs.module }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      # Pinned to the tag rather than left to the default. On a tag push
      # the default happens to be the tag; on a workflow_dispatch it is
      # the default branch, and the job would verify a commit that is not
      # the one being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - id: parse
        name: parse the tag
        env:
          # Through the environment, never interpolated into the script: a
          # workflow_dispatch input is somebody's typing, and `; rm -rf /`
          # is valid typing.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"

          # contrib/gin/v0.1.0 -> module=contrib/gin, version=0.1.0
          # v0.1.0             -> module=.,           version=0.1.0
          case "$tag" in
            contrib/*/v*) module="${tag%/v*}"; version="${tag##*/v}" ;;
            v*)           module="."; version="${tag#v}" ;;
            *)            echo "::error::$tag is not a release tag"; exit 1 ;;
          esac

          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac

          {
            echo "tag=$tag"
            echo "module=$module"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: the tag is on main
        env:
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          tag="$TAG"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$tag" origin/main \
            || { echo "::error::$tag is not an ancestor of main"; exit 1; }

      - name: the changelog has a section for it
        if: steps.parse.outputs.module == '.'
        run: ./scripts/changelog.sh "${{ steps.parse.outputs.version }}" > /dev/null

      # The gate, run against exactly the commit being published rather
      # than against whatever was on a developer's disk.
      - name: the gate passes at this commit
        run: make check

      # And the integration suite, which make check does not include
      # because it needs a directory. A release that has not been run
      # against a real server — over plaintext, LDAPS and StartTLS — is a
      # release nobody has actually tried.
      - name: the integration suite passes at this commit
        run: ./scripts/integration.sh --down

      - if: failure()
        run: docker compose -f integration/compose.yml logs

      # A contrib module is developed against the checkout through a
      # replace directive, so this is the first time it is built against
      # the version it actually requires. If the require line is wrong,
      # this is where it shows.
      - name: the contrib module builds against the published root
        if: steps.parse.outputs.module != '.'
        run: |
          cd "${{ steps.parse.outputs.module }}"
          go mod edit -dropreplace github.com/ctolon/ldap-authenticator
          go mod tidy
          go build ./...
          go test ./...

  # The release is published for every platform, so it is tested on every
  # platform we have a runner for. A release that only ever ran on Linux
  # is a release that says nothing about Windows.
  platforms:
    name: tests (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go test -race -count=1 ./...
      - name: the contrib modules too
        shell: bash
        run: |
          for module in contrib/gin contrib/echo contrib/fiber; do
            ( cd "$module" && go test -race -count=1 ./... )
          done

  publish:
    name: publish
    needs: [verify, platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - id: notes
        name: build the release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          module="${{ needs.verify.outputs.module }}"
          version="${{ needs.verify.outputs.version }}"

          {
            echo "body<<RELEASE_NOTES_EOF"

            if [ "$module" = "." ]; then
              ./scripts/changelog.sh "$version"
              echo
              echo '```sh'
              echo "go get github.com/ctolon/ldap-authenticator@$tag"
              echo '```'
            else
              echo "Framework middleware module \`$module\`, released alongside \`v$version\` of the root module."
              echo
              echo '```sh'
              echo "go get github.com/ctolon/ldap-authenticator/$module@v$version"
              echo '```'
            fi

            echo
            echo "[Documentation](https://pkg.go.dev/github.com/ctolon/ldap-authenticator@$tag) · [Changelog](https://github.com/ctolon/ldap-authenticator/blob/main/CHANGELOG.md)"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: publish the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ needs.verify.outputs.prerelease }}

  index:
    name: warm the module proxy
    needs: [verify, platforms, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: ask the proxy for the new version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          module="${{ needs.verify.outputs.module }}"

          if [ "$module" = "." ]; then
            path="github.com/ctolon/ldap-authenticator@$tag"
          else
            path="github.com/ctolon/ldap-authenticator/$module@v${{ needs.verify.outputs.version }}"
          fi

          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org go list -m "$path"; then
              exit 0
            fi

            echo "not indexed yet (attempt $attempt); waiting"
            sleep 30
          done

          echo "::warning::the proxy has not indexed $path yet; it usually catches up within the hour"
