# The checks worth running on a schedule rather than on a push:
# vulnerability scanning, supply-chain posture, and fuzzing for long enough
# to find something a smoke run would not.
name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Read-only at the top; the scorecard job asks for exactly what it needs
# and nothing else does.
permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make vuln

  scorecard:
    name: OpenSSF scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing to the OpenSSF API only works on a scheduled run.
          # Asking for it on a push does nothing except look like it
          # worked, which is how a badge ends up reading "invalid repo
          # path" while every run is green. The push run still uploads
          # SARIF to code scanning, which is the part that is useful
          # per-commit.
          publish_results: ${{ github.event_name == 'schedule' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: results.sarif

  deep-fuzz:
    name: deep fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make fuzz-smoke FUZZTIME=8m
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: '**/testdata/fuzz/**'
          if-no-files-found: warn

  soak:
    name: pool and failover soak
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # The integration suite under the race detector, repeated, against a
      # real directory: the shape of failure that only shows up after the
      # pool has churned for a while.
      - run: ./scripts/integration.sh -count=25
      - name: the unit suite, repeated, under the race detector
        run: go test -race -count=25 ./...
      - if: always()
        run: docker compose -f integration/compose.yml down --volumes

  security-green:
    name: security-green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [govulncheck, scorecard, deep-fuzz, soak]
    if: always()
    steps:
      - name: fail if anything above failed
        run: |
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "a required job did not pass"
            exit 1
          fi
