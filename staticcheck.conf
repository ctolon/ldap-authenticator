# staticcheck's defaults leave the documentation checks off. They are on
# here, because a library's exported surface is its documentation, and an
# exported symbol with no doc comment is a symbol somebody has to read the
# implementation to use.
#
# ST1000 (package comment) is on: every package in this repository has one.
# ST1003 (initialisms) is off: it objects to Dn and Url, which do not
# appear here, and to nothing else we write.
checks = [
    "all",
    "-ST1003",
]
